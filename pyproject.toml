[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palit"
version = "0.1.0"
description = "PanelApp Australia literature assessment for rare disease gene curation"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "cryptography",
    "defusedxml",
    "docling",
    "httpx",
    "jinja2",
    "jsonschema",
    "lxml",
    "markdown>=3.10.2",
    "metapub",
    "nh3>=0.3.6",
    "openai",
    "plotly",
    "pydantic-ai-slim[bedrock,openai]",
    "pronto",
    "pydantic-settings",
    "pypdf",
    "rich",
    "tenacity",
    "tqdm",
    "typer",
    "boto3>=1.43.51",
]

[project.optional-dependencies]
docling-macos = [
    "mlx-vlm",
]
ml = [
    "flashinfer-python; sys_platform == 'linux'",
    "openai-harmony",
    "scikit-learn",
    "scipy>=1.18.0",
    "torch",
    "transformers",
    "vllm>=0.25.1; sys_platform == 'linux'",
    "wandb",
]

[project.scripts]
palit = "palit.cli:app"

[tool.uv]
# Supply-chain hygiene: never resolve a version uploaded in the last 7 days.
# Declared here (not only in the global uv config) so every resolver — local,
# CI, and Dependabot — shares the identical cutoff and produces a lockfile that
# already complies with it. Mirrors the Dependabot `cooldown` in
# .github/dependabot.yml. Override per package with `exclude-newer-package`
# (e.g. to accept a security fix younger than the window).
exclude-newer = "7 days"
# transformers 5.9.0 hardcodes torch.float64 in RT-DETR v2's positional
# embedding, which Apple Silicon MPS cannot allocate, so docling's layout model
# crashes during `palit docling convert` on macOS (docling#3483,
# huggingface/transformers#46174). 5.8.x is the last MPS-safe line and is
# accepted by both docling-ibm-models and vllm (the HPC dependency), so this
# single cap keeps one transformers version across all platforms. We constrain
# rather than depend: palit code never imports transformers directly — it is
# pulled in transitively. Remove once docling ships MPS float16 support (docling
# PR #2721). Mirrored by a Dependabot ignore in .github/dependabot.yml.
constraint-dependencies = ["transformers>=5.8.1,<5.9.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade - modernize Python code
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "B008",   # Do not perform function call in argument defaults - false positive with Typer
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]

# Ignore specific ML package imports that are optional dependencies
# These packages are only needed for ML workflows, not for core functionality
[[tool.mypy.overrides]]
module = [
    "vllm",
    "vllm.*",
    "wandb",
    "wandb.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
