# Dependabot configuration for palit.
#
# Strategy:
# - Weekly version-update PRs, grouped so minor/patch bumps land in a single
#   PR. Majors still get individual PRs so they can be reviewed in isolation.
# - Security-update PRs (opened as soon as an advisory drops) reuse the same
#   group; that switch is toggled separately at
#   Settings -> Code security -> "Dependabot security updates".
# - 7-day cooldown matches the supply-chain hygiene policy `exclude-newer =
#   "7 days"`, declared in pyproject `[tool.uv]` (and the global uv config) so
#   local, CI, and Dependabot resolution share the same cutoff. Without it
#   Dependabot would open PRs for versions CI then rejects because they are too
#   fresh.
# - One uv entry covers the Python side: palit is a single uv project at the
#   repo root, and Dependabot resolves the whole uv.lock, including the `ml`
#   extra and the `dev` dependency-group. The npm entry covers viewer/.
# - Review requests come from .github/CODEOWNERS. Dependabot's `reviewers:`
#   option was retired by GitHub in 2025 (it is now silently ignored), so the
#   code owner is what gets a review request on each PR.
# - No explicit `labels:` — Dependabot applies its defaults (`dependencies`
#   plus the `python:uv` ecosystem label, which it auto-creates). Naming a label
#   here that Dependabot does not auto-create makes it error whenever that label
#   is missing from the repo.
#
# Auto-merge is intentionally NOT wired up: `main` has no branch protection and
# CI runs lint/mypy only (no test job), so there is no gate to merge behind.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      python-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The report's PDF viewer page (viewer/). Its in-repo .npmrc sets the same
  # 7-day min-release-age, so the cooldown keeps Dependabot from proposing
  # versions the install would reject.
  - package-ecosystem: "npm"
    directory: "/viewer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      viewer-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
